name: prism-pasco-oracle

services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: elephant
      POSTGRES_PASSWORD: elephant
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elephant"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  restate:
    image: restatedev/restate:1.7.2
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9070:9070"
    environment:
      RESTATE_NODE_NAME: restate-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - restate-data:/restate-data
    restart: unless-stopped

volumes:
  pg-data:
  restate-data:
